services:
  code-db-ords-deploy:
    secrets:
      - sia_db_username_secret
      - sia_db_password_secret
      - picadm_db_username_secret
      - picadm_db_password_secret
secrets:
  sia_db_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_sia_db_username_secret
    external: true
  sia_db_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_sia_db_password_secret
    external: true
  picadm_db_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_picadm_db_username_secret
    external: true
  picadm_db_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_picadm_db_password_secret
    external: true